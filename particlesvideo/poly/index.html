<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, height=device-height, shrink-to-fit=0, user-scalable=no, minimum-scale=1.0, maximum-scale=1.0" />
  <link rel="icon" href="data:," />
  <title>Retopo — Voronoi polygonization of image &amp; video (WebGPU)</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #000;
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
      color: #ddd;
    }
    #container { width: 100%; height: 100%; display: block; }
    #veil {
      position: absolute; inset: 0;
      background: #000; opacity: 1;
      pointer-events: none;
      transition: opacity 1s ease-in-out;
    }
    #progress-bar {
      position: absolute; width: 200px; height: 4px;
      left: 50vw; top: 50vh;
      transform: translate(-50%, -50%);
      background: #262626; transition: opacity 0.2s ease;
    }
    #progress { position: absolute; left: 0; top: 0; width: 0; height: 4px; background: #9a9a9a; transition: width 0.2s ease; }
    #error {
      position: absolute; left: 50vw; top: 50vh;
      transform: translate(-50%, -50%);
      color: #fff; visibility: hidden; max-width: 80vw; text-align: center; font-size: 13px;
    }
    #panel {
      position: absolute; top: 14px; right: 14px; z-index: 100;
      width: 296px; max-height: calc(100vh - 28px);
      overflow-y: auto;
      padding: 12px;
      background: rgba(8, 8, 10, 0.86);
      border: 1px solid #333;
      border-radius: 10px;
      backdrop-filter: blur(6px);
      box-shadow: 0 8px 28px rgba(0, 0, 0, 0.6);
    }
    #panel::-webkit-scrollbar { width: 6px; }
    #panel::-webkit-scrollbar-thumb { background: #444; border-radius: 3px; }
    #panel h1 { font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; margin: 0 0 8px; color: #8a8a8a; font-weight: 600; }
    #file-input { display: none; }
    button.big {
      width: 100%; padding: 9px 12px; margin-bottom: 6px;
      background: #2a2a2e; color: #eee;
      border: 1px solid #454549; border-radius: 6px;
      font-size: 12px; cursor: pointer; transition: background 0.15s;
    }
    button.big:hover { background: #36363c; }
    #play-button { display: none; }
    #source-info { font-size: 10px; color: #888; margin: 4px 0 8px; word-break: break-all; }
    #hint { font-size: 10px; color: #6a6a6a; line-height: 1.5; margin-bottom: 8px; }
    #settings-panel { margin-top: 10px; border-top: 1px solid #303030; padding-top: 10px; }
    #settings-panel .tp-dfwv { width: 100%; }
    #source-video { display: none; }
  </style>
</head>
<body>
<div id="container">
  <div id="veil">
    <div id="progress-bar"><div id="progress"></div></div>
    <div id="error"></div>
  </div>
  <div id="panel">
    <h1>Retopology 8:3</h1>
    <input type="file" id="file-input" accept="image/*,video/*" />
    <button class="big" id="upload-button">📁 Load image / video</button>
    <button class="big" id="play-button">⏸ Pause</button>
    <div id="source-info">no source loaded</div>
    <div id="hint">Drop a file anywhere. The frame is a fixed 8:3 panel — the polygons grow out of it along Z.</div>
    <div id="settings-panel"></div>
  </div>
  <video id="source-video" muted loop playsinline></video>
  <script src="./index.js" type="module"></script>
</div>
</body>
</html>
